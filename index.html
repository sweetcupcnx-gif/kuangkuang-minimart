<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ควงควงมินิมาร์ท</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, sans-serif; background:#f8f7f4; color:#222; padding-bottom:96px; }
    header { background:#fff; padding:14px 14px 12px; position:sticky; top:0; z-index:20; border-bottom:1px solid #eee; box-shadow:0 4px 20px rgba(0,0,0,.035); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1080px; margin:0 auto; }
    .logo { display:flex; align-items:center; gap:10px; min-width:190px; }
    .logo-mark { width:42px; height:42px; border-radius:14px; background:#222; color:#fff; display:grid; place-items:center; font-weight:800; letter-spacing:-2px; font-size:17px; }
    .logo-text strong { display:block; font-size:18px; line-height:1.1; }
    .logo-text span { font-size:11px; color:#777; letter-spacing:1.7px; }
    .cart-top-btn { border:0; background:#222; color:#fff; border-radius:999px; padding:11px 14px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .search-wrap { max-width:1080px; margin:12px auto 0; position:relative; }
    .search-wrap input { width:100%; padding:13px 16px 13px 42px; border:1px solid #e5e5e5; background:#f8f8f8; border-radius:16px; font-size:15px; outline:none; }
    .search-icon { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:#777; }
    .hero { max-width:1080px; margin:14px auto 0; background:linear-gradient(135deg,#222,#505050); color:#fff; border-radius:24px; padding:22px; display:flex; align-items:center; justify-content:space-between; gap:14px; overflow:hidden; }
    .hero h2 { margin:0 0 5px; font-size:22px; }
    .hero p { margin:0; color:rgba(255,255,255,.75); font-size:14px; }
    .hero-badge { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.24); border-radius:999px; padding:9px 12px; font-size:13px; white-space:nowrap; }
    .tabs { display:flex; gap:9px; overflow-x:auto; padding:14px; background:#f8f7f4; position:sticky; top:137px; z-index:15; max-width:1080px; margin:0 auto; }
    .tab { border:1px solid #e6e1d8; background:#fff; padding:9px 14px; border-radius:999px; white-space:nowrap; cursor:pointer; font-size:14px; color:#333; }
    .tab.active { background:#222; color:#fff; border-color:#222; }
    .container { padding:0 14px 16px; max-width:1080px; margin:auto; }
    .section-title { display:flex; align-items:end; justify-content:space-between; margin:6px 0 14px; }
    .section-title h3 { margin:0; font-size:20px; }
    .section-title span { color:#777; font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:14px; }
    .card { background:#fff; border-radius:22px; overflow:hidden; border:1px solid #ededed; box-shadow:0 8px 24px rgba(0,0,0,.045); display:flex; flex-direction:column; transition:transform .15s ease, box-shadow .15s ease; }
    .card:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,0,0,.07); }
    .image-wrap { position:relative; background:#f2f2f2; }
    .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
    .tag { position:absolute; left:10px; top:10px; background:rgba(255,255,255,.9); border-radius:999px; padding:5px 8px; font-size:11px; color:#555; }
    .info { padding:12px; }
    .name { font-weight:700; font-size:15px; min-height:40px; line-height:1.35; }
    .price { margin-top:6px; color:#111; font-weight:800; font-size:17px; }
    .qty-row { display:flex; align-items:center; justify-content:space-between; margin-top:11px; background:#f3f3f3; border-radius:999px; padding:5px; }
    .qty-row button { width:34px; height:34px; border-radius:50%; border:0; background:#222; color:#fff; font-size:21px; cursor:pointer; line-height:1; }
    .qty { font-weight:800; min-width:28px; text-align:center; }
    .cart-bar { position:fixed; left:12px; right:12px; bottom:12px; background:#222; color:white; border-radius:22px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:0 12px 34px rgba(0,0,0,.25); max-width:980px; margin:auto; z-index:30; }
    .cart-bar button, .submit-btn { border:0; background:#fff; color:#111; font-weight:800; padding:11px 15px; border-radius:14px; cursor:pointer; }
    .cart-mini { color:rgba(255,255,255,.78); font-size:13px; }
    .drawer { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:40; }
    .drawer.open { display:flex; }
    .drawer-content { background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:28px 28px 0 0; padding:18px; max-width:760px; margin:0 auto; }
    .drawer-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .drawer-head h2 { margin:0; }
    .close { border:0; background:#f2f2f2; padding:9px 13px; border-radius:12px; cursor:pointer; }
    .cart-item { display:grid; grid-template-columns:1fr auto; gap:8px; padding:13px 0; border-bottom:1px solid #eee; }
    .cart-item small { color:#777; }
    .summary-box { background:#f8f8f8; border-radius:18px; padding:12px; margin-top:14px; }
    .summary-line { display:flex; justify-content:space-between; margin:9px 0; font-size:16px; }
    .total { font-size:21px; font-weight:900; border-top:1px solid #ddd; padding-top:11px; }
    label { display:block; margin-top:12px; font-weight:800; }
    input, textarea, select { width:100%; padding:12px; margin-top:6px; border:1px solid #e2e2e2; border-radius:14px; font-size:15px; background:white; outline:none; }
    textarea { min-height:72px; }
    .note { margin-top:12px; background:#f6f6f6; padding:10px; border-radius:14px; font-size:13px; color:#555; }
    .empty { padding:24px; text-align:center; color:#777; background:#fff; border-radius:18px; border:1px dashed #ddd; }
    @media (max-width:560px) { .logo-text strong{font-size:16px;} .logo{min-width:0;} .hero{align-items:flex-start; flex-direction:column;} .tabs{top:136px;} .grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px;} .card{border-radius:18px;} .name{font-size:14px; min-height:38px;} .price{font-size:16px;} }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="logo"><div class="logo-mark">KK</div><div class="logo-text"><strong>ควงควงมินิมาร์ท</strong><span>MINIMART ONLINE</span></div></div>
      <button class="cart-top-btn" onclick="openCart()">🛒 <span id="topCartCount">0</span></button>
    </div>
    <div class="search-wrap"><span class="search-icon">🔍</span><input id="searchInput" type="text" placeholder="ค้นหาสินค้า เช่น น้ำเปล่า มาม่า สบู่" oninput="renderProducts()" /></div>
  </header>
  <section class="container"><div class="hero"><div><h2>ของใช้ ของกิน เครื่องดื่ม</h2><p>เลือกสินค้า กด + ใส่รถเข็น แล้วส่งออเดอร์ทาง LINE</p></div><div class="hero-badge">🛵 ส่งไวใกล้ร้าน</div></div></section>
  <div class="tabs" id="tabs"></div>
  <main class="container"><div class="section-title"><h3 id="sectionTitle">สินค้าทั้งหมด</h3><span id="productCount">0 รายการ</span></div><div class="grid" id="productGrid"></div></main>
  <div class="cart-bar"><div><strong id="cartCount">0 รายการ</strong><br /><span class="cart-mini" id="cartTotal">รวม 0 บาท</span></div><button onclick="openCart()">ดูรถเข็น</button></div>
  <div class="drawer" id="drawer"><div class="drawer-content"><div class="drawer-head"><h2>รถเข็น</h2><button class="close" onclick="closeCart()">ปิด</button></div><div id="cartItems"></div><div class="summary-box"><div class="summary-line"><span>ค่าสินค้า</span><strong id="subTotal">0 บาท</strong></div><div class="summary-line"><span>ค่าส่ง</span><strong id="deliveryFee">20 บาท</strong></div><div class="summary-line total"><span>ยอดรวม</span><strong id="grandTotal">0 บาท</strong></div></div><label>ชื่อลูกค้า</label><input id="customerName" placeholder="เช่น คุณแนน" /><label>เบอร์โทร</label><input id="phone" placeholder="เช่น 063-xxx-xxxx" /><label>ที่อยู่ / จุดสังเกต</label><textarea id="address" placeholder="บ้านเลขที่ ซอย คอนโด หรือจุดสังเกต"></textarea><label>วิธีรับสินค้า</label><select id="deliveryType" onchange="renderCart()"><option value="delivery">จัดส่ง ค่าส่ง 20 บาท</option><option value="pickup">รับหน้าร้าน ค่าส่ง 0 บาท</option></select><label>หมายเหตุ</label><textarea id="note" placeholder="เช่น โทรก่อนส่ง / ขอของเย็น"></textarea><button class="submit-btn" style="width:100%; margin-top:16px; background:#222; color:#fff;" onclick="sendToLine()">ส่งออเดอร์ทาง LINE</button><div class="note">ระบบจะคัดลอกรายละเอียดออเดอร์ให้อัตโนมัติ แล้วเปิด LINE OA ของร้าน</div></div></div>
  <script>
    const products = [
      { id:'D001', name:'น้ำเปล่า 600 ml', price:10, category:'เครื่องดื่ม', image:'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=600&q=80' },
      { id:'D002', name:'น้ำเปล่าแพ็ก 12 ขวด', price:55, category:'เครื่องดื่ม', image:'https://images.unsplash.com/photo-1564419320461-6870880221ad?auto=format&fit=crop&w=600&q=80' },
      { id:'D003', name:'โค้กกระป๋อง', price:18, category:'เครื่องดื่ม', image:'https://images.unsplash.com/photo-1581006852262-e4307cf6283a?auto=format&fit=crop&w=600&q=80' },
      { id:'D004', name:'น้ำส้มพร้อมดื่ม', price:20, category:'เครื่องดื่ม', image:'https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=600&q=80' },
      { id:'D005', name:'ชาเขียวขวด', price:25, category:'เครื่องดื่ม', image:'https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=600&q=80' },
      { id:'F001', name:'มาม่า 1 ซอง', price:8, category:'ของกิน', image:'https://images.unsplash.com/photo-1612927601601-6638404737ce?auto=format&fit=crop&w=600&q=80' },
      { id:'F002', name:'ขนมมันฝรั่ง', price:25, category:'ของกิน', image:'https://images.unsplash.com/photo-1621447504864-d8686e12698c?auto=format&fit=crop&w=600&q=80' },
      { id:'F003', name:'ปลากระป๋อง', price:22, category:'ของกิน', image:'https://images.unsplash.com/photo-1604908177522-040a1cb46b6f?auto=format&fit=crop&w=600&q=80' },
      { id:'F004', name:'ไข่ไก่ 1 ฟอง', price:5, category:'ของกิน', image:'https://images.unsplash.com/photo-1506976785307-8732e854ad03?auto=format&fit=crop&w=600&q=80' },
      { id:'F005', name:'ขนมปังแผ่น', price:38, category:'เบเกอรี่', image:'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80' },
      { id:'F006', name:'นมสดกล่อง', price:15, category:'ของแช่เย็น', image:'https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=600&q=80' },
      { id:'F007', name:'โยเกิร์ตถ้วย', price:18, category:'ของแช่เย็น', image:'https://images.unsplash.com/photo-1571212515416-fef01fc43637?auto=format&fit=crop&w=600&q=80' },
      { id:'H001', name:'สบู่ก้อน', price:15, category:'ของใช้', image:'https://images.unsplash.com/photo-1607006483224-942a9fef2f1e?auto=format&fit=crop&w=600&q=80' },
      { id:'H002', name:'ยาสระผม', price:59, category:'ของใช้', image:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=600&q=80' },
      { id:'H003', name:'ผงซักฟอก', price:65, category:'ของใช้', image:'https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?auto=format&fit=crop&w=600&q=80' },
      { id:'H004', name:'กระดาษทิชชู่', price:35, category:'ของใช้', image:'https://images.unsplash.com/photo-1584559582128-b8be739912e1?auto=format&fit=crop&w=600&q=80' },
      { id:'H005', name:'น้ำยาล้างจาน', price:39, category:'ของใช้', image:'https://images.unsplash.com/photo-1583947215259-38e31be8751f?auto=format&fit=crop&w=600&q=80' }
    ];
    let activeCategory='ทั้งหมด'; const cart={};
    function categories(){ return ['ทั้งหมด','เครื่องดื่ม','ของกิน','เบเกอรี่','ของแช่เย็น','ของใช้']; }
    function renderTabs(){ document.getElementById('tabs').innerHTML=categories().map(cat=>`<button class="tab ${cat===activeCategory?'active':''}" onclick="setCategory('${cat}')">${cat}</button>`).join(''); }
    function setCategory(cat){ activeCategory=cat; renderTabs(); renderProducts(); }
    function filteredProducts(){ const keyword=document.getElementById('searchInput').value.trim().toLowerCase(); return products.filter(p=>{ const matchCategory=activeCategory==='ทั้งหมด'||p.category===activeCategory; const matchKeyword=!keyword||p.name.toLowerCase().includes(keyword)||p.category.toLowerCase().includes(keyword)||p.id.toLowerCase().includes(keyword); return matchCategory&&matchKeyword; }); }
    function renderProducts(){ const list=filteredProducts(); document.getElementById('sectionTitle').textContent=activeCategory==='ทั้งหมด'?'สินค้าทั้งหมด':activeCategory; document.getElementById('productCount').textContent=`${list.length} รายการ`; document.getElementById('productGrid').innerHTML=list.length?list.map(p=>`<div class="card"><div class="image-wrap"><span class="tag">${p.category}</span><img src="${p.image}" alt="${p.name}" /></div><div class="info"><div class="name">${p.name}</div><div class="price">฿${p.price}</div><div class="qty-row"><button onclick="changeQty('${p.id}',-1)">−</button><span class="qty">${cart[p.id]||0}</span><button onclick="changeQty('${p.id}',1)">+</button></div></div></div>`).join(''):'<div class="empty">ไม่พบสินค้าที่ค้นหา</div>'; }
    function changeQty(id,delta){ cart[id]=Math.max(0,(cart[id]||0)+delta); if(cart[id]===0) delete cart[id]; renderProducts(); renderCartBar(); renderCart(); }
    function getCartList(){ return Object.entries(cart).map(([id,qty])=>{ const product=products.find(p=>p.id===id); return {...product,qty,total:product.price*qty}; }); }
    function subtotal(){ return getCartList().reduce((sum,item)=>sum+item.total,0); }
    function fee(){ return document.getElementById('deliveryType')?.value==='pickup'?0:20; }
    function renderCartBar(){ const count=getCartList().reduce((sum,item)=>sum+item.qty,0); document.getElementById('cartCount').textContent=`${count} รายการ`; document.getElementById('topCartCount').textContent=count; document.getElementById('cartTotal').textContent=`รวม ${subtotal()} บาท`; }
    function renderCart(){ const list=getCartList(); document.getElementById('cartItems').innerHTML=list.length?list.map(item=>`<div class="cart-item"><div><strong>${item.name}</strong><br /><small>${item.qty} x ${item.price} บาท</small></div><strong>${item.total} บาท</strong></div>`).join(''):'<p class="empty">ยังไม่มีสินค้าในรถเข็น</p>'; document.getElementById('subTotal').textContent=`${subtotal()} บาท`; document.getElementById('deliveryFee').textContent=`${fee()} บาท`; document.getElementById('grandTotal').textContent=`${subtotal()+fee()} บาท`; }
    function openCart(){ document.getElementById('drawer').classList.add('open'); renderCart(); }
    function closeCart(){ document.getElementById('drawer').classList.remove('open'); }
    function sendToLine(){ const list=getCartList(); if(!list.length) return alert('กรุณาเลือกสินค้าก่อน'); const name=document.getElementById('customerName').value.trim(); const phone=document.getElementById('phone').value.trim(); const address=document.getElementById('address').value.trim(); const deliveryType=document.getElementById('deliveryType').value==='pickup'?'รับหน้าร้าน':'จัดส่ง'; const note=document.getElementById('note').value.trim(); const itemsText=list.map(item=>`- ${item.name} x ${item.qty} = ${item.total} บาท`).join('\n'); const message=`ออเดอร์จากควงควงมินิมาร์ท\n\n${itemsText}\n\nค่าสินค้า: ${subtotal()} บาท\nค่าส่ง: ${fee()} บาท\nยอดรวม: ${subtotal()+fee()} บาท\n\nชื่อ: ${name}\nเบอร์: ${phone}\nวิธีรับสินค้า: ${deliveryType}\nที่อยู่: ${address}\nหมายเหตุ: ${note}`; const lineOaUrl='https://lin.ee/98HPvqF'; navigator.clipboard.writeText(message).then(()=>{ alert('คัดลอกออเดอร์แล้ว ให้วางส่งใน LINE OA ได้เลย'); window.open(lineOaUrl,'_blank'); }).catch(()=>{ alert(message); }); }
    renderTabs(); renderProducts(); renderCartBar();
  </script>
</body>
</html>
